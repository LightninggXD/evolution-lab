<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Ink" subtitle="Cream/white card surfaces, thick dark-brown outline ink, and text hierarchy" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#e8e2d5;font-family:var(--font-body);display:flex;align-items:center;box-sizing:border-box}*{box-sizing:border-box}</style>
<div style="display:flex;gap:14px;padding:20px;width:100%">
<div style="flex:1"><div style="height:64px;border-radius:14px;background:var(--cream-panel);border:3px solid var(--outline)"></div><div style="color:var(--text-primary);font-size:12px;margin-top:6px;font-weight:700">Panel white</div></div>
<div style="flex:1"><div style="height:64px;border-radius:14px;background:var(--surface-card-alt);border:3px solid var(--outline)"></div><div style="color:var(--text-primary);font-size:12px;margin-top:6px;font-weight:700">Panel alt (cream)</div></div>
<div style="flex:1"><div style="height:64px;border-radius:14px;background:var(--outline)"></div><div style="color:var(--text-primary);font-size:12px;margin-top:6px;font-weight:700">Outline ink</div></div>
<div style="flex:1.6;display:flex;flex-direction:column;gap:6px;justify-content:center">
<div style="color:var(--text-primary);font-weight:800;font-size:14px">Primary text</div>
<div style="color:var(--text-secondary);font-weight:700;font-size:13px">Secondary text</div>
<div style="color:var(--text-tertiary);font-weight:700;font-size:12px">Tertiary text</div>
</div>
</div>
