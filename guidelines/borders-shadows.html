<!-- @dsCard group="Colors" viewport="700x180" name="Outline & Hard Shadow" subtitle="Every panel/button/icon gets a thick dark outline, glossy gradient fill, and a flat drop shadow offset down" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#e8e2d5;font-family:var(--font-body);display:flex;align-items:center;box-sizing:border-box}*{box-sizing:border-box}
.comic-text{font-family:var(--font-display);font-weight:800;color:#fff;-webkit-text-stroke:2.5px var(--outline);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.2);transform:skewX(-6deg) rotate(-2deg);display:inline-block}
.glossy{position:relative;border-radius:16px;border:4px solid var(--outline);box-shadow:0 6px 0 var(--outline);display:flex;align-items:center;justify-content:center;overflow:hidden}
.glossy-btn{position:relative;border-radius:999px;border:4px solid var(--outline);box-shadow:0 6px 0 var(--outline);display:flex;align-items:center;justify-content:center;overflow:hidden}
.glossy::before,.glossy-btn::before{content:'';position:absolute;top:8%;left:10%;right:10%;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));border-radius:50%}
</style>
<div style="display:flex;gap:16px;padding:20px 20px 28px;width:100%">
<div class="glossy" style="flex:1;height:96px;background:var(--cream-panel)"><div style="color:var(--text-secondary);font-size:11px;padding:8px;position:relative">Plain card: cream + outline + hard shadow</div></div>
<div class="glossy-btn" style="flex:1;height:64px;align-self:center;background:linear-gradient(180deg,color-mix(in srgb,#fff 68%,var(--engine-green)) 0%,var(--engine-green) 55%,color-mix(in srgb,#000 70%,var(--engine-green)) 100%)"><span class="comic-text" style="font-size:20px;position:relative">Claim!</span></div>
<div class="glossy" style="flex:1;height:96px;background:linear-gradient(180deg,color-mix(in srgb,#fff 68%,var(--engine-blue)) 0%,var(--engine-blue) 55%,color-mix(in srgb,#000 70%,var(--engine-blue)) 100%);border-width:5px"><div style="color:#fff;font-size:11px;padding:8px;font-weight:700;position:relative">Modal: thicker outline</div></div>
</div>
