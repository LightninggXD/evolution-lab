<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#e8e2d5;font-family:var(--font-body);display:flex;align-items:center;box-sizing:border-box}*{box-sizing:border-box}.comic-text{font-family:var(--font-display);font-weight:800;color:#fff;-webkit-text-stroke:2.5px var(--outline);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.2);transform:skewX(-6deg) rotate(-2deg);display:inline-block}.glossy{position:relative;border-radius:16px;border:4px solid var(--outline);box-shadow:0 6px 0 var(--outline);display:flex;align-items:center;justify-content:center;overflow:hidden}.glossy::before{content:'';position:absolute;top:6%;left:6%;right:6%;height:38%;background:rgba(255,255,255,.55);border-radius:50%;filter:blur(1px)}</style>
<div style="display:flex;gap:8px;padding:20px;width:100%;flex-wrap:wrap">
<div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--green-500) 70%,white) 0%,var(--green-500) 55%,color-mix(in srgb,var(--green-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Green</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue-500) 70%,white) 0%,var(--blue-500) 55%,color-mix(in srgb,var(--blue-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Blue</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold-500) 70%,white) 0%,var(--gold-500) 55%,color-mix(in srgb,var(--gold-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Gold</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--red-500) 70%,white) 0%,var(--red-500) 55%,color-mix(in srgb,var(--red-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Red</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--purple-500) 70%,white) 0%,var(--purple-500) 55%,color-mix(in srgb,var(--purple-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Purple</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--pink-500) 70%,white) 0%,var(--pink-500) 55%,color-mix(in srgb,var(--pink-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Pink</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--orange-500) 70%,white) 0%,var(--orange-500) 55%,color-mix(in srgb,var(--orange-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Orange</div></div><div style="flex:1;min-width:64px"><div class="glossy" style="height:64px;background:linear-gradient(180deg,color-mix(in srgb,var(--teal-500) 70%,white) 0%,var(--teal-500) 55%,color-mix(in srgb,var(--teal-500) 75%,black) 100%)"></div><div style="color:var(--text-primary);font-size:11px;margin-top:6px;font-weight:700;text-align:center">Teal</div></div>
